name: hermes-composer-spellcheck-plugin
version: 1.0.0
description: "Spell check for the Hermes Desktop composer: right-click suggestions ranked with Damerau-Levenshtein over the standard SCOWL/Hunspell English dictionary, a Custom Words page for the words you add, and the dictionary's capitalisation kept, so a lowercase proper noun such as 'english' is flagged and the suggestion offered is the capitalised 'English'; the red underline is enabled only when the app exposes host.composer.setSpellcheck, and without it the suggestions work while Chromium's underline stays off - deliberately with no DOM-attribute fallback."
author: thileman
license: MIT
kind: standalone
platforms:
  - windows
  - macos
  - linux
tags:
  - desktop
  - spellcheck
  - spelling
  - dictionary
  - composer
requires_hermes: ">=0.22.6"
