name: hermes-composer-spellcheck-plugin
version: 1.0.0
description: "Spell check for the Hermes Desktop composer: right-click suggestions ranked with Damerau-Levenshtein over the standard SCOWL/Hunspell English dictionary, a Custom Words page for the words you add, and the dictionary's capitalisation kept, so a lowercase proper noun such as 'english' is flagged and the suggestion offered is the capitalised 'English'; the suggestions are rows in the app's own composer context menu, a seam that upstream merged on 2026-10-23 (#143678) and that is in no release yet, so they need a newer Hermes than 0.22.5 - on 0.22.5 the plugin still loads and the dictionary and Custom Words page work, but there are no right-click suggestions and it says so once instead of being refused; the red underline is enabled only when the app exposes host.composer.setSpellcheck, which is in an open upstream PR and is in no release yet, and without it the suggestions work while Chromium's underline stays off - deliberately with no DOM-attribute fallback; the optional 'Ignore code spans' setting declares the draft's non-prose ranges through COMPOSER_AREAS.nonProse, a seam that is in an open upstream PR (#144007) and in no release yet, so on a host without it the plugin registers no provider and hides the setting row rather than offering a switch that cannot work - the plugin still loads, and it writes nothing into the composer's DOM either way."
author: thileman
license: MIT
kind: standalone
platforms:
  - windows
  - macos
  - linux
tags:
  - desktop
  - spellcheck
  - spelling
  - dictionary
  - composer
requires_hermes: ">=0.22.5"
