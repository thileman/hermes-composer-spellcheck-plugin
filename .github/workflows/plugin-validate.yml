name: Plugin Validate

# The admission gate the catalog runs: `hermes plugins validate` from the
# CURRENT hermes-agent main branch, not from a pinned local copy.
#
# Why current-main and not a pin: the desktop-surface and security-scan rules
# change as Hermes changes, and a plugin that passes a stale scanner can still
# be rejected by the one that runs at review time. Running the live scanner
# here is what catches that BEFORE the catalog PR.
#
# The action is Hermes' own composite action, so the toolchain it builds is
# the same one the catalog CI builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: hermes plugins validate (current main)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out hermes-agent (current main)
        uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: .hermes-validator
          persist-credentials: false

      # setup_toolchain.py resolves the Hermes source from its own location
      # (Path(__file__).resolve().parents[2]), so it is called by ABSOLUTE path
      # and the toolchain home is absolute too. A relative path resolves
      # against the step's working directory instead, which is not the source.
      - name: Prepare the locked Python toolchain
        shell: bash
        env:
          _SOURCE: ${{ github.workspace }}/.hermes-validator
        run: |
          set -euo pipefail
          python3 -S "$_SOURCE/scripts/ci/setup_toolchain.py" prepare \
            --toolchain python --home "$_SOURCE/.build/pm"
          python3 -S "$_SOURCE/scripts/ci/setup_toolchain.py" install \
            --toolchain python --home "$_SOURCE/.build/pm"

      # The install step above exports HERMES_PYTHON to GITHUB_ENV, so the
      # interpreter that has the toolchain is the one that must build the
      # validator environment.
      #
      # `pm` is a package at the ROOT of the Hermes source tree, so the
      # interpreter must be able to import it: python adds the working
      # directory to sys.path when it reads a program from stdin, so this
      # step runs with the Hermes source as its working directory.
      - name: Build the isolated validator runtime
        id: runtime
        shell: bash
        working-directory: .hermes-validator
        env:
          _SOURCE: ${{ github.workspace }}/.hermes-validator
        run: |
          set -euo pipefail
          "$HERMES_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          from pm import build_environment
          source = Path(os.environ["_SOURCE"])
          python = build_environment(source=source, out=source / ".build/validator", explicit=True)
          # GITHUB_OUTPUT is a FILE the runner appends step outputs to, not a
          # directory — joining "/a" onto it is a NotADirectoryError.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"python={python}\n")
          PY

      - name: Run hermes plugins validate
        shell: bash
        env:
          _VALIDATOR_PYTHON: ${{ steps.runtime.outputs.python }}
        run: |
          set -euo pipefail
          # The scanner WALKS the directory it is given, and the Hermes checkout
          # lives INSIDE the workspace (.hermes-validator/), so validating the
          # workspace would scan Hermes' own tree — its locale files, its
          # agent config, its own source — and report findings that have
          # nothing to do with this plugin. Validate a copy that contains
          # only the plugin.
          PLUGIN_COPY="$RUNNER_TEMP/plugin-under-test"
          rm -rf "$PLUGIN_COPY"
          mkdir -p "$PLUGIN_COPY"
          cp -R "$GITHUB_WORKSPACE/plugin.yaml" "$GITHUB_WORKSPACE/desktop" "$PLUGIN_COPY/"
          # The plugin dir is a hardlink-free copy, so nothing from the
          # workspace (or the validator checkout) is inside the scanned tree.
          find "$PLUGIN_COPY" -type l -print -quit | grep -q . && {
            echo "::error::plugin copy contains a symlink; refusing to scan"
            exit 1
          }
          "$_VALIDATOR_PYTHON" -I -m hermes_cli.main plugins validate "$PLUGIN_COPY"
